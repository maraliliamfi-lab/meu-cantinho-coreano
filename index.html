<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9b75c9"><title>Meu Cantinho Coreano 🌸</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Meu Cantinho Coreano"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#453650;background:#faf6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f8efff,#fff8fc 55%,#f3efff);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff9ffcc;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);border-bottom:1px solid #eadbf3}.top{max-width:980px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:1.12rem}.sub{font-size:.76rem;color:#85718e}nav{display:flex;gap:7px;overflow-x:auto;padding:0 14px 12px;max-width:980px;margin:auto}nav button{white-space:nowrap;background:white;border:1px solid #e6d8f0;border-radius:24px;padding:10px 15px;color:#725e80}nav button.active,.primary{background:#9364c5;color:white;border:0}main{max-width:980px;margin:auto;padding:20px 16px 90px}.hero{border-radius:25px;background:linear-gradient(115deg,#a884d3,#d6a4cb);padding:25px;color:white;box-shadow:0 12px 35px #aa8fc045}.hero h1{margin:4px 0;font-size:clamp(1.6rem,5vw,2.4rem)}.hero p{margin:7px 0;opacity:.95}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.panel{background:#fff;border:1px solid #eee3f5;border-radius:20px;padding:18px;box-shadow:0 5px 22px #8d73a00d}.stat{text-align:center}.stat b{font-size:1.55rem;color:#885bb5;display:block}.stat span{font-size:.78rem;color:#8a7993}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.panel h2{margin:0 0 12px;font-size:1.18rem}.panel p{color:#786d82;line-height:1.5}.btn{border:1px solid #ddcce9;background:white;color:#77538f;padding:13px 17px;border-radius:14px;font-weight:700}.btn.primary{background:#9364c5;color:white;border:0}.btn:disabled{opacity:.45}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.flash{margin:15px auto;max-width:650px;text-align:center;background:white;border:1px solid #e8d8f1;border-radius:26px;padding:30px 16px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.hangul{font-size:clamp(2.7rem,9vw,4.4rem);font-weight:750;line-height:1.3}.translation{font-size:1.45rem;font-weight:700;color:#8255ae}.muted{color:#8a7c92;font-size:.9rem}.pill{border-radius:20px;padding:7px 11px;background:#f3eafb;color:#815ca1;font-size:.78rem}.choice{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid #e7d9f0;background:#fff;padding:15px;border-radius:13px}.choice.correct{background:#e4f8e9;border-color:#81c897}.choice.wrong{background:#fff0f0;border-color:#df9b9b}.bar{background:#efe6f5;border-radius:20px;height:10px;overflow:hidden}.fill{background:#a475cf;height:100%;transition:width .2s}.field{width:100%;padding:13px;border:1px solid #dac9e7;border-radius:12px;background:white;margin:6px 0 13px}.wordrow{padding:12px 0;border-bottom:1px solid #f0e7f6;display:flex;align-items:center;justify-content:space-between;gap:10px}.wordrow strong{font-size:1.15rem}.hide{display:none!important}.notice{background:#f6edff;border-radius:13px;padding:12px;font-size:.86rem;color:#765b8c}.tiny{font-size:.78rem}.footer{color:#8c8093;font-size:.75rem;text-align:center;margin:24px}select{max-width:100%}@media(max-width:420px){.stats{gap:6px}.stat{padding:13px 5px}.stat b{font-size:1.3rem}.top{padding:12px}.brand{font-size:.98rem}.flash{padding:23px 12px}}
</style></head><body><header><div class="top"><div><div class="brand">🌸 Meu Cantinho Coreano</div><div class="sub">한국어 공부 · Aprender no seu ritmo</div></div><div class="pill" id="headerDue">🇰🇷 Vamos estudar!</div></div><nav id="nav"><button data-page="inicio" class="active">🏠 Início</button><button data-page="cartoes">🧠 Cartões</button><button data-page="quiz">🎮 Quiz</button><button data-page="dificeis">🌷 Difíceis</button><button data-page="dicionario">📖 Dicionário</button><button data-page="progresso">⭐ Progresso</button></nav></header><main id="app"></main><script>
'use strict';const KEY='cantinho_coreano_v1';const DAY=86400000;const seed=[
['사랑','amor','Sentimentos','사랑해요.','Eu te amo.'],['행복','felicidade','Sentimentos','행복해요.','Estou feliz.'],['마음','coração / sentimento','Sentimentos','마음이 따뜻해요.','Meu coração está aquecido.'],['기쁨','alegria','Sentimentos','큰 기쁨이에요.','É uma grande alegria.'],['슬픔','tristeza','Sentimentos','슬픔을 느껴요.','Sinto tristeza.'],['친구','amigo(a)','Cotidiano','제 친구예요.','É meu amigo / minha amiga.'],['오늘','hoje','Cotidiano','오늘은 금요일이에요.','Hoje é sexta-feira.'],['내일','amanhã','Cotidiano','내일 만나요.','Até amanhã.'],['시간','tempo / hora','Cotidiano','시간이 있어요?','Você tem tempo?'],['집','casa','Cotidiano','집에 가요.','Vou para casa.'],['물','água','Alimentação','물을 마셔요.','Bebo água.'],['밥','arroz cozido / refeição','Alimentação','밥 먹었어요?','Você já comeu?'],['커피','café','Alimentação','커피 주세요.','Um café, por favor.'],['맛있어요','está gostoso','Alimentação','정말 맛있어요.','Está muito gostoso.'],['배고파요','estou com fome','Alimentação','저는 배고파요.','Estou com fome.'],['여행','viagem','Viagem','여행을 좋아해요.','Gosto de viajar.'],['공항','aeroporto','Viagem','공항에 가요.','Vou ao aeroporto.'],['지하철','metrô','Viagem','지하철을 타요.','Pego o metrô.'],['어디','onde','Viagem','화장실이 어디예요?','Onde fica o banheiro?'],['얼마예요?','quanto custa?','Viagem','이거 얼마예요?','Quanto custa isto?'],['괜찮아요','está tudo bem / tudo bem','Doramas','저는 괜찮아요.','Estou bem.'],['보고 싶어요','estou com saudade / quero ver você','Doramas','정말 보고 싶어요.','Estou com muita saudade.'],['진짜','de verdade / sério','Doramas','진짜예요?','É sério?'],['잠깐만요','um momento, por favor','Doramas','잠깐만요!','Um momento!'],['왜요?','por quê?','Doramas','왜요? 무슨 일이에요?','Por quê? O que aconteceu?'],['고마워요','obrigado(a)','Cotidiano','정말 고마워요.','Muito obrigado(a).'],['미안해요','desculpe','Cotidiano','미안해요.','Desculpe.'],['좋아요','é bom / gosto','Cotidiano','정말 좋아요.','É muito bom.'],['책','livro','Cotidiano','책을 읽어요.','Leio um livro.'],['공부','estudo','Cotidiano','한국어 공부를 해요.','Estudo coreano.'] ];
function fresh(){return {words:seed.map((w,i)=>({id:i+1,ko:w[0],pt:w[1],cat:w[2],example:w[3],examplePt:w[4],interval:0,due:0,success:0,attempts:0})),events:[],daily:{},nextId:1000}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(data.words)||!Array.isArray(data.events))throw 1}catch{data=fresh()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Não foi possível salvar neste navegador. Faça um backup dos dados.')}}const $=s=>document.querySelector(s),app=$('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=()=>new Date().toLocaleDateString('sv-SE');const due=()=>data.words.filter(w=>w.due<=Date.now());const learned=()=>data.words.filter(w=>w.success>0).length;const todayCount=()=>data.events.filter(e=>e.day===dateKey()).length;let page='inicio',card=null,revealed=false,direction='ko',quiz=null,selected=null,filter='Todas',search='';
function speak(s){if(!('speechSynthesis'in window)){alert('Áudio indisponível neste navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.82;speechSynthesis.speak(u)}function button(label,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function difficultWords(){return data.words.filter(w=>w.attempts>0 && w.attempts>w.success).sort((a,b)=>(b.attempts-b.success)-(a.attempts-a.success))}function startDifficult(){let ws=difficultWords();if(!ws.length){go('dificeis');return}card=ws[0];revealed=false;go('cartoes')}function difficultPage(){let ws=difficultWords();app.innerHTML=`<div class="panel"><h2>🌷 Minhas palavras difíceis</h2><p>As palavras que você errou mais do que acertou aparecem aqui. Elas continuam disponíveis nas revisões normais.</p><div class="stats"><div class="stat"><b>${ws.length}</b><span>Para praticar</span></div><div class="stat"><b>${data.words.length-ws.length}</b><span>Outras palavras</span></div><div class="stat"><b>${due().length}</b><span>Revisões agora</span></div></div>${ws.length?button('🧠 Treinar palavras difíceis',"startDifficult()",'btn primary'):'<p class="notice">Ainda não há palavras difíceis registradas. Continue praticando! 💜</p>'}${ws.map(w=>`<div class="wordrow"><div><strong>${esc(w.ko)}</strong><div>${esc(w.pt)}</div><div class="tiny muted">${esc(w.cat)} · ${w.attempts-w.success} erro(s)</div></div><button class="btn" onclick="sayWord(${w.id})">🔊</button></div>`).join('')}</div>`}function head(){ $('#headerDue').textContent=`🌸 ${due().length} para revisar` }function render(){head();({inicio:home,cartoes:cards,quiz:quizzes,dificeis:difficultPage,dicionario:dictionary,progresso:progress})[page]()}function home(){app.innerHTML=`<section class="hero"><div>🌸 안녕하세요!</div><h1>Seu cantinho de coreano 💜</h1><p>Um pouquinho por dia, muitas palavras na memória!</p></section><div class="stats"><div class="stat"><b>${data.words.length}</b><span>No dicionário</span></div><div class="stat"><b>${learned()}</b><span>Já acertadas</span></div><div class="stat"><b>${todayCount()}</b><span>Revisões hoje</span></div></div><div class="grid"><div class="panel"><h2>🧠 Memória inteligente</h2><p>Revise palavras difíceis e revele a tradução só depois de tentar lembrar.</p>${button('Começar cartões →',"startCards()",'btn primary')}</div><div class="panel"><h2>🎮 Desafio rápido</h2><p>Escolha a tradução correta e treine sua memória com alternativas.</p>${button('Jogar quiz →',"startQuiz()",'btn primary')}</div><div class="panel"><h2>🌷 Minhas palavras difíceis</h2><p>Treine as palavras que ainda não ficaram na memória.</p>${button('Praticar difíceis →',"go('dificeis')",'btn primary')}</div><div class="panel"><h2>📖 Meu dicionário</h2><p>Palavras do cotidiano, sentimentos, viagens, comida e doramas. Adicione as suas!</p>${button('Ver palavras →',"go('dicionario')")}</div><div class="panel"><h2>⭐ Seu progresso</h2><p>Veja seus acertos e faça uma cópia de segurança do que aprendeu.</p>${button('Ver progresso →',"go('progresso')")}</div></div><p class="footer">Dica: estude 10–15 minutos e revise as palavras que mais esquece. 🌷</p>`}
function nextCard(){let list=due();if(!list.length)list=data.words; if(!list.length){card=null;return}let shuffled=list.slice().sort((a,b)=>(a.due-b.due)||(a.success-b.success));card=shuffled[0];revealed=false}function startCards(){direction='ko';nextCard();go('cartoes')}function cards(){if(!card)nextCard();if(!card){app.innerHTML='<p>Adicione palavras ao dicionário para começar.</p>';return}app.innerHTML=`<div class="panel"><h2>🧠 Cartões de memória</h2><p class="muted">Pense na resposta antes de virar o cartão.</p><div class="actions"><button class="btn ${direction==='ko'?'primary':''}" onclick="direction='ko';revealed=false;render()">한국어 → Português</button><button class="btn ${direction==='pt'?'primary':''}" onclick="direction='pt';revealed=false;render()">Português → 한국어</button></div><div class="flash"><span class="pill">${esc(card.cat)}</span><div class="${direction==='ko'?'hangul':'translation'}">${esc(direction==='ko'?card.ko:card.pt)}</div>${revealed?`<div class="translation">${esc(direction==='ko'?card.pt:card.ko)}</div><div class="muted">${esc(card.example)} — ${esc(card.examplePt)}</div><button class="btn" onclick="speak(${JSON.stringify(card.ko).replace(/"/g,'&quot;')})">🔊 Ouvir em coreano</button>`:`<p class="muted">Você lembra o significado?</p>${button('👀 Revelar resposta',"revealed=true;render()",'btn primary')}`}</div>${revealed?`<div class="actions" style="justify-content:center">${button('😅 Não lembrei',"rate(false)")}${button('🌟 Acertei!',"rate(true)",'btn primary')}</div>`:''}<p class="tiny muted">Revisões disponíveis agora: ${due().length}. Se todas estiverem em dia, você pode praticar novamente.</p></div>`}
function rate(ok){if(!card)return;card.attempts++;if(ok){card.success++;card.interval=card.interval===0?1:Math.min(60,Math.ceil(card.interval*2.2));card.due=Date.now()+card.interval*DAY}else{card.interval=0;card.due=Date.now()+120000}data.events.push({day:dateKey(),id:card.id,ok,mode:'cartão'});save();let old=card.id;let pool=due().filter(w=>w.id!==old);card=pool.length?pool.sort((a,b)=>a.due-b.due)[0]:data.words.find(w=>w.id!==old)||data.words[0];revealed=false;render()}
function startQuiz(){pickQuiz();go('quiz')}function pickQuiz(){let ws=data.words;if(ws.length<4){quiz=null;return}let q=ws[Math.floor(Math.random()*ws.length)];let opts=[q,...ws.filter(w=>w.id!==q.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);quiz={q,opts};selected=null}function quizzes(){if(!quiz)pickQuiz();if(!quiz){app.innerHTML='<p>É preciso ter pelo menos 4 palavras.</p>';return}let q=quiz.q;app.innerHTML=`<div class="panel"><h2>🎮 Qual é a tradução?</h2><div class="flash" style="min-height:175px"><div class="hangul">${esc(q.ko)}</div><button class="btn" onclick="speak(${JSON.stringify(q.ko).replace(/"/g,'&quot;')})">🔊 Ouvir</button></div>${quiz.opts.map(w=>`<button class="choice ${selected!==null?(w.id===q.id?'correct':w.id===selected?'wrong':''):''}" ${selected!==null?'disabled':''} onclick="answer(${w.id})">${esc(w.pt)}</button>`).join('')}${selected!==null?`<p class="notice">${selected===q.id?'🌟 Muito bem!':'💜 Essa volta para revisão.'} ${esc(q.ko)} = ${esc(q.pt)}</p>${button('Próxima palavra →',"pickQuiz();render()",'btn primary')}`:''}</div>`}function answer(id){if(selected!==null)return;selected=id;let q=quiz.q,ok=id===q.id;q.attempts++;if(ok){q.success++;q.interval=q.interval===0?1:Math.min(60,Math.ceil(q.interval*2));q.due=Date.now()+q.interval*DAY}else{q.interval=0;q.due=Date.now()+120000}data.events.push({day:dateKey(),id:q.id,ok,mode:'quiz'});save();render()}
function dictionary(){let cats=['Todas',...new Set(data.words.map(w=>w.cat))];let ws=data.words.filter(w=>(filter==='Todas'||w.cat===filter)&&(w.ko+' '+w.pt+' '+w.cat).toLowerCase().includes(search.toLowerCase()));app.innerHTML=`<div class="panel"><h2>📖 Meu dicionário (${data.words.length})</h2><input id="search" class="field" placeholder="Buscar em coreano ou português" value="${esc(search)}"><select class="field" id="filter">${cats.map(c=>`<option ${c===filter?'selected':''}>${esc(c)}</option>`).join('')}</select><div id="wordlist">${ws.map(w=>`<div class="wordrow"><div><strong>${esc(w.ko)}</strong><div>${esc(w.pt)}</div><div class="tiny muted">${esc(w.cat)} · ${w.success} acerto(s)</div></div><div class="actions"><button class="btn" onclick="sayWord(${w.id})">🔊</button><button class="btn" onclick="removeWord(${w.id})">✕</button></div></div>`).join('')||'<p>Nenhuma palavra encontrada.</p>'}</div></div><div class="panel" style="margin-top:15px"><h2>🌸 Adicionar palavra</h2><form id="addform"><label>Palavra em coreano<input class="field" name="ko" required maxlength="90" placeholder="예: 꽃"></label><label>Tradução em português<input class="field" name="pt" required maxlength="120" placeholder="Ex.: flor"></label><label>Categoria<select class="field" name="cat"><option>Cotidiano</option><option>Sentimentos</option><option>Alimentação</option><option>Viagem</option><option>Doramas</option><option>Minhas palavras</option></select></label><label>Frase em coreano (opcional)<input class="field" name="example" maxlength="180"></label><label>Tradução da frase (opcional)<input class="field" name="examplePt" maxlength="180"></label><button class="btn primary" type="submit">+ Guardar palavra</button></form></div>`;$('#search').oninput=e=>{search=e.target.value;dictionary();$('#search').focus();$('#search').setSelectionRange(search.length,search.length)};$('#filter').onchange=e=>{filter=e.target.value;dictionary()};$('#addform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.words.push({id:data.nextId++,ko:f.get('ko').trim(),pt:f.get('pt').trim(),cat:f.get('cat'),example:f.get('example').trim(),examplePt:f.get('examplePt').trim(),interval:0,due:0,success:0,attempts:0});save();dictionary();alert('Palavra guardada! 🌸')}}function sayWord(id){let w=data.words.find(w=>w.id===id);if(w)speak(w.ko)}function removeWord(id){if(!confirm('Excluir esta palavra do seu dicionário?'))return;data.words=data.words.filter(w=>w.id!==id);if(card?.id===id)card=null;save();dictionary()}
function progress(){let hits=data.events.filter(e=>e.ok).length,total=data.events.length,accuracy=total?Math.round(hits/total*100):0;app.innerHTML=`<div class="panel"><h2>⭐ Meu progresso</h2><div class="stats"><div class="stat"><b>${total}</b><span>Respostas</span></div><div class="stat"><b>${accuracy}%</b><span>Acertos</span></div><div class="stat"><b>${learned()}</b><span>Palavras acertadas</span></div></div><p>Palavras já acertadas pelo menos uma vez</p><div class="bar"><div class="fill" style="width:${data.words.length?learned()/data.words.length*100:0}%"></div></div><p class="muted">${learned()} de ${data.words.length} palavras · ${due().length} disponíveis para revisão</p></div><div class="panel" style="margin-top:15px"><h2>💾 Backup e restauração</h2><p>Salvamos os dados neste navegador. Para protegê-los, exporte uma cópia de segurança regularmente, especialmente antes de trocar de tablet ou limpar dados do navegador.</p><div class="actions">${button('⬇️ Baixar backup',"backup()",'btn primary')}<label class="btn" style="display:inline-block">⬆️ Restaurar backup<input id="restore" type="file" accept=".json,application/json" class="hide"></label></div><p class="tiny muted">A restauração substitui os dados atuais. Guarde seu arquivo em um lugar seguro.</p></div>`;$('#restore').onchange=restore}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cantinho_coreano_backup_${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.words)||!Array.isArray(obj.events)||!obj.words.every(w=>typeof w.ko==='string'&&typeof w.pt==='string'))throw 1;if(!confirm('Substituir seu progresso atual pelos dados deste backup?'))return;data=obj;data.nextId=Math.max(1000,Number(data.nextId)||0,...data.words.map(w=>Number(w.id)+1));save();card=null;quiz=null;render();alert('Backup restaurado! 🌸')}catch{alert('Não foi possível ler esse backup.')}}window.go=go;window.startCards=startCards;window.startQuiz=startQuiz;window.startDifficult=startDifficult;window.rate=rate;window.answer=answer;window.pickQuiz=pickQuiz;window.speak=speak;window.sayWord=sayWord;window.removeWord=removeWord;window.backup=backup;window.direction=direction;window.render=render;window.revealed=revealed;Object.defineProperty(window,'direction',{get:()=>direction,set:v=>direction=v});Object.defineProperty(window,'revealed',{get:()=>revealed,set:v=>revealed=v});render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
